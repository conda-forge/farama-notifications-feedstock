{% set name = "farama-notifications" %}
{% set version = "0.0.6" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: b19acac4bb41d76e59e03394b5dd165f4761c86fa327f56307a35cbee3b60158

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv
  number: 0

requirements:
  host:
    - python >=3.6
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >=3.6

test:
  imports:
    - farama_notifications
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://github.com/Farama-Foundation/Farama-Notifications
  summary: Notifications for all Farama Foundation maintained libraries.
  license: MIT
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ChristofKaufmann
